<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigSmart preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(180deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%); color: #ffffff; }
    #root { height: 100vh; width: 100vw; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.EXPO_PLATFORM = 'web';
  </script>
  <!-- Load Expo web dev bundle from the running dev server.
       IMPORTANT: use `localhost`, not `127.0.0.1` — Expo's dev-server security
       middleware only whitelists `localhost:*` origins; a 127.0.0.1 origin gets
       HTTP 401 "Unauthorized" on the bundle. -->
  <script src="http://localhost:19008/index.web.bundle?platform=web&dev=true&hot=false&lazy=false"></script>
</body>
</html>
