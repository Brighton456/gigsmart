<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta httpEquiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GigSmart</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">

  <!-- iOS standalone support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GigSmart">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(180deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
      color: #ffffff;
    }
    #root { 
      height: 100vh; 
      width: 100vw; 
      display: flex;
      flex-direction: column;
    }
    .loading-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .loading-text {
      font-size: 18px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
    }
    .loading-subtext {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #ffffff;
      border-top: 3px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.EXPO_PLATFORM = 'web';

    // Gentle heads-up if the app bundle fails to boot (React replaces this
    // node the moment the app mounts, so a lingering message = real failure).
    window.addEventListener('load', () => {
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.warn('[GigSmart] App has not mounted 5s after load — check console/network for the failing script.');
        }
      }, 5000);
    });
  </script>
  <!-- The app bundle is injected here at build time by webpack. -->
</body>
</html>
