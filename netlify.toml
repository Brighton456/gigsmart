[build]
  command = "pnpm install --frozen-lockfile && pnpm exec expo export --platform web && node scripts/copy-pwa-assets.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_HOME = "/opt/buildhome/.pnpm"

# SPA fallback: every route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on everything.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The HTML shell must ALWAYS revalidate — immutable caching here was causing
# users to run a stale app until they manually refreshed.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-hashed bundles and assets are safe to cache forever.
[[headers]]
  for = "/bundles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
