<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Locked zoom: behaves like a fixed Android app (no pinch / double-tap zoom). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GigSmart</title>

  <!-- Installed-app launches live at /app (manifest start_url). Once a session
       has app mode, every launch is kept at /app so browser-only UI (the
       install prompt) never shows inside the installed app. -->
  <script>
    (function () {
      var MODE_KEY = 'gigs_pwa_mode';
      var APP_VERSION = '3'; // must match SW VERSION (public/sw.js)

      // SELF-HEAL: if an older build registered a service worker, this new
      // build removes it and wipes its caches once, then reloads with a clean
      // slate. Users stuck on the old broken shell are rescued automatically.
      var lastHeal = 0;
      try { lastHeal = Number(localStorage.getItem('gigs_healed_v') || 0); } catch (e) {}
      if (lastHeal < APP_VERSION && 'serviceWorker' in navigator && navigator.serviceWorker.controller) {
        try { localStorage.setItem('gigs_healed_v', String(APP_VERSION)); } catch (e) {}
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
          .then(function () { return caches.keys(); })
          .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          .then(function () { location.replace(location.href); })
          .catch(function () { /* keep loading anyway */ });
        return; // this load is disposable; the reload runs the clean path
      }

      var path = location.pathname.replace(/\/+$/, '') || '/';
      var mode = null;
      try { mode = sessionStorage.getItem(MODE_KEY); } catch (e) { /* storage blocked */ }
      if (mode === 'app' && path !== '/app') {
        location.replace('/app' + (path === '/' ? '/' : path) + location.search);
        return;
      }
      var IS_APP = path === '/app' || mode === 'app';
      if (path === '/app') { try { sessionStorage.setItem(MODE_KEY, 'app'); } catch (e) {} }
      window.__GIGS_IS_APP__ = IS_APP;
      document.documentElement.classList.add(IS_APP ? 'pwa-app' : 'pwa-web');
    })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">

  <!-- iOS standalone support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GigSmart">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    /* App-like shell: no rubber-band bounce, no double-tap zoom delay. */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(180deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
      color: #ffffff;
      overflow-x: hidden;
    }
    #root {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      /* The RNW app tree uses flex: 1 from the very top — without this the
         root container collapses to 0px and the UI squishes to the top of
         the screen over the body gradient. */
      display: flex;
      flex-direction: column;
    }
    #root > * { flex: 1; min-height: 0; }

    /* Instant splash: visible before React mounts, replaced by the real app. */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
      transition: opacity .25s ease;
    }
    #boot-splash .logo {
      width: 84px; height: 84px; border-radius: 20px;
      background: rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; letter-spacing: 1px; color: #fff;
      margin-bottom: 18px;
    }
    #boot-splash .bar {
      width: 120px; height: 3px; border-radius: 3px;
      background: rgba(255,255,255,.18); overflow: hidden;
    }
    #boot-splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 3px; background: #fff;
      animation: bootslide 1.1s ease-in-out infinite;
    }
    #boot-splash p { margin: 14px 0 0; font-size: 13px; color: rgba(255,255,255,.7); text-align: center; padding: 0 24px; }
    #boot-splash .retry {
      display: none; margin-top: 18px; padding: 10px 26px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1);
      color: #fff; font-size: 14px;
    }
    html.app-mounted #boot-splash { opacity: 0; pointer-events: none; }
    @keyframes bootslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="boot-splash">
    <div class="logo">GS</div>
    <div class="bar"><i></i></div>
    <p id="boot-msg">Loading…</p>
    <button class="retry" onclick="location.reload()">Retry</button>
  </div>

  <script>
    window.EXPO_PLATFORM = 'web';
    // Remove the splash the moment React actually mounts (#root gets children).
    // If the bundle never boots (offline, stale service worker, blocked script),
    // surface a retry button instead of a forever-spinner.
    (function () {
      var check = setInterval(function () {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          clearInterval(check);
          document.documentElement.classList.add('app-mounted');
          setTimeout(function () {
            var s = document.getElementById('boot-splash');
            if (s && s.parentNode) s.parentNode.removeChild(s);
          }, 300);
        }
      }, 150);
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length === 0) {
            var msg = document.getElementById('boot-msg');
            var retry = document.querySelector('#boot-splash .retry');
            if (msg) msg.textContent = 'Taking longer than usual — check your connection.';
            if (retry) retry.style.display = 'block';
          }
        }, 8000);
      });

      // AUTO-UPDATE: ask the service worker which version is running. If the
      // app is fully loaded but the worker reports a DIFFERENT build than the
      // one that loaded this page, reload exactly once per session to pick up
      // the new deploy — users never have to "refresh to see changes" again.
      // (Page tag and SW VERSION below must stay in lockstep.)
      var PAGE_BUILD = 'v3';
      var alreadyUpdated = null;
      try { alreadyUpdated = sessionStorage.getItem('gigs_updated'); } catch (e) {}
      setTimeout(function () {
        if (!('serviceWorker' in navigator) || alreadyUpdated) return;
        navigator.serviceWorker.ready.then(function (reg) {
          var channel = new MessageChannel();
          channel.port1.onmessage = function (event) {
            if (event.data && event.data.type === 'VERSION' && event.data.version !== PAGE_BUILD) {
              try { sessionStorage.setItem('gigs_updated', '1'); } catch (e) {}
              location.reload();
            }
          };
          reg.active && reg.active.postMessage({ type: 'GET_VERSION' }, [channel.port2]);
        }).catch(function () {});
      }, 5000);
    })();
  </script>
  <!-- The app bundle is injected here at build time by webpack. -->
</body>
</html>
